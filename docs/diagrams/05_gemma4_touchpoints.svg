<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="1000" viewBox="0 0 1460 1000" font-family="Helvetica, Arial, sans-serif">
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
  <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
  <style>
    .t{font-size:15px;font-weight:700;fill:#0f172a}
    .s{font-size:12.5px;fill:#334155}
    .o{font-size:12px;fill:#b45309;font-weight:700}
    .lab{font-size:11.5px;fill:#475569}
    .tag{font-size:12px;font-weight:700;fill:#475569;letter-spacing:.06em}
    .impl{fill:#e6f4f1;stroke:#0f766e;stroke-width:2}
    .ext{fill:#f1f5f9;stroke:#64748b;stroke-width:2}
    .prop{fill:#f5f3ff;stroke:#6d28d9;stroke-width:2;stroke-dasharray:7 5}
    .amb{fill:#fff7ed;stroke:#b45309;stroke-width:2}
    .ln{stroke:#475569;stroke-width:1.8;fill:none}
    .lp{stroke:#6d28d9;stroke-width:1.8;fill:none;stroke-dasharray:6 4}
    .card{fill:#ffffff;stroke:#e2e8f0}
    .ct{font-size:16px;font-weight:700}
    .cs{font-size:13.5px;fill:#334155}
  </style>
</defs><rect width="1460" height="1000" fill="#f8fafc"/>
<text class="tag" x="30" y="34" text-anchor="start" >H-NEG × GEMMA 4   /   05</text>
<text x="30" y="72" font-size="30" font-weight="800" fill="#0f172a">Where H-NEG Touches Gemma 4</text>
<text x="30" y="100" font-size="15" fill="#475569">No weights, layers, attention or KV-cache code are modified. H-NEG acts on the prompt it sends, the logits that come out, and the loop around the model.</text>
<rect x="1140" y="18" width="290" height="30" rx="15" fill="#e6f4f1" stroke="#0f766e" stroke-dasharray="4 3"/>
<text x="1285.0" y="38" text-anchor="middle" font-size="12.5" font-weight="800" fill="#0f766e" letter-spacing=".08em">NO ARCHITECTURE CHANGE</text>
<rect x="20" y="120" width="1420" height="690" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
<text class="tag" x="60" y="148" text-anchor="start" >GEMMA 4 DECODER (UNMODIFIED)</text>
<text class="tag" x="860" y="148" text-anchor="start" >H-NEG</text>
<rect class="ext" x="60" y="165" width="600" height="56" rx="6"/>
<text class="t" x="360.0" y="189.5" text-anchor="middle" >Prompt tokens</text>
<text class="s" x="360.0" y="206.5" text-anchor="middle" >issue + code excerpt + latest diagnostic</text>
<rect class="ext" x="60" y="240" width="600" height="56" rx="6"/>
<text class="t" x="360.0" y="264.5" text-anchor="middle" >Token embedding</text>
<text class="s" x="360.0" y="281.5" text-anchor="middle" >vocabulary 262,144</text>
<rect class="ext" x="60" y="315" width="600" height="70" rx="6"/>
<text class="t" x="360.0" y="338.0" text-anchor="middle" >Decoder blocks × N</text>
<text class="s" x="360.0" y="355.0" text-anchor="middle" >5 local sliding-window layers (RoPE) : 1 global layer (p-RoPE)</text>
<text class="s" x="360.0" y="373.0" text-anchor="middle" >global layers share K = V; final layer is global</text>
<rect class="ext" x="60" y="410" width="600" height="56" rx="6"/>
<text class="t" x="360.0" y="434.5" text-anchor="middle" >Feed-forward</text>
<text class="s" x="360.0" y="451.5" text-anchor="middle" >dense (E2B, E4B, 31B) · MoE (26B-A4B)</text>
<rect class="ext" x="60" y="485" width="600" height="56" rx="6"/>
<text class="t" x="360.0" y="509.5" text-anchor="middle" >Final norm → LM head → logits zₜ</text>
<text class="s" x="360.0" y="526.5" text-anchor="middle" >final-logit soft-cap inside the model graph</text>
<rect class="ext" x="60" y="565" width="600" height="56" rx="6"/>
<text class="t" x="360.0" y="589.5" text-anchor="middle" >Token selection</text>
<text class="s" x="360.0" y="606.5" text-anchor="middle" >greedy in our runs (temperature 0)</text>
<rect class="ext" x="60" y="640" width="600" height="56" rx="6"/>
<text class="t" x="360.0" y="664.5" text-anchor="middle" >Output text</text>
<text class="s" x="360.0" y="681.5" text-anchor="middle" >SEARCH/REPLACE edit</text>
<polyline class="ln" points="360.0,221 360.0,238" marker-end="url(#a)"/>
<polyline class="ln" points="360.0,296 360.0,313" marker-end="url(#a)"/>
<polyline class="ln" points="360.0,385 360.0,408" marker-end="url(#a)"/>
<polyline class="ln" points="360.0,466 360.0,483" marker-end="url(#a)"/>
<polyline class="ln" points="360.0,541 360.0,563" marker-end="url(#a)"/>
<polyline class="ln" points="360.0,621 360.0,638" marker-end="url(#a)"/>
<rect class="ext" x="60" y="720" width="600" height="56" rx="6"/>
<text class="t" x="360.0" y="744.5" text-anchor="middle" >MTP drafter heads (alongside the LM head)</text>
<text class="s" x="360.0" y="761.5" text-anchor="middle" >draft future tokens for verification · not used by the llama.cpp runs</text>
<rect class="impl" x="860" y="155" width="560" height="76" rx="6"/>
<text class="t" x="1140.0" y="181.0" text-anchor="middle" >Context control (implemented)</text>
<text class="s" x="1140.0" y="198.0" text-anchor="middle" >≤ 3 attempts, only the latest diagnostic kept</text>
<text class="s" x="1140.0" y="216.0" text-anchor="middle" >peak prompt 9,320 vs 19,202 tokens (baseline)</text>
<polyline class="ln" points="858,193 662,193" marker-end="url(#a)"/>
<rect class="prop" x="860" y="245" width="560" height="56" rx="6"/>
<text class="t" x="1140.0" y="269.5" text-anchor="middle" >CPG embedding adapter (proposed)</text>
<text class="s" x="1140.0" y="286.5" text-anchor="middle" >e′ᵢ = eᵢ + Δeᵢ, needs training · Figure 4</text>
<polyline class="lp" points="858,268 662,268" marker-end="url(#ap)"/>
<rect class="ext" x="860" y="322" width="560" height="150" rx="6"/>
<text class="t" x="1140.0" y="368.0" text-anchor="middle" >No change</text>
<text class="s" x="1140.0" y="385.0" text-anchor="middle" >attention pattern, positional encoding, K = V sharing,</text>
<text class="s" x="1140.0" y="403.0" text-anchor="middle" >KV-cache reuse, feed-forward / MoE routing.</text>
<text class="s" x="1140.0" y="421.0" text-anchor="middle" >Shorter prompts mean less KV-cache in global layers;</text>
<text class="s" x="1140.0" y="439.0" text-anchor="middle" >local layers are bounded by their window anyway.</text>
<rect class="impl" x="860" y="485" width="560" height="70" rx="6"/>
<text class="t" x="1140.0" y="508.0" text-anchor="middle" >Logit mask Mₜ (implemented)</text>
<text class="s" x="1140.0" y="525.0" text-anchor="middle" >z̃ₜ = zₜ + Mₜ · CPG scope gate + edit replay guard</text>
<text class="s" x="1140.0" y="543.0" text-anchor="middle" >llama.cpp logits_processor · Figure 3</text>
<polyline class="ln" points="858,520 662,520" marker-end="url(#a)"/>
<rect class="impl" x="860" y="640" width="560" height="70" rx="6"/>
<text class="t" x="1140.0" y="663.0" text-anchor="middle" >Agent loop (implemented, outside the model)</text>
<text class="s" x="1140.0" y="680.0" text-anchor="middle" >apply edit → reflex → tests → statechart, K = 3</text>
<text class="s" x="1140.0" y="698.0" text-anchor="middle" >GRACEFUL_HALT · Figures 1 and 2</text>
<polyline class="ln" points="662,668 858,668" marker-end="url(#a)"/>
<polyline class="ln" points="1420,675 1432,675 1432,193 1422,193" marker-end="url(#a)"/>
<text class="lab" x="1382" y="630" text-anchor="start" >retry</text>
<rect class="prop" x="860" y="725" width="560" height="56" rx="6"/>
<text class="t" x="1140.0" y="749.5" text-anchor="middle" >Drafter-logit masking (proposed)</text>
<text class="s" x="1140.0" y="766.5" text-anchor="middle" >same Mₜ on draft and target prefixes · Figure 3</text>
<polyline class="lp" points="858,748 662,748" marker-end="url(#ap)"/>
<rect x="20" y="830" width="1420" height="40" fill="#eef2f7"/>
<rect x="20" y="830" width="4" height="40" fill="#64748b"/>
<text class="cs" x="38" y="855" text-anchor="start" >Gemma 4 components as described in the official Gemma 4 documentation and Grootendorst&#x27;s Visual Guide; vocabulary size read from the GGUF used in our runs.</text>
<rect class="impl" x="30" y="890" width="30" height="16" rx="3"/>
<text class="s" x="68" y="903" text-anchor="start" >Implemented and exercised in the Kaggle runs</text>
<rect class="amb" x="360" y="890" width="30" height="16" rx="3"/>
<text class="s" x="398" y="903" text-anchor="start" >Implemented, not exercised in the runs</text>
<rect class="prop" x="660" y="890" width="30" height="16" rx="3"/>
<text class="s" x="698" y="903" text-anchor="start" >Proposed, not implemented</text>
<rect class="ext" x="900" y="890" width="30" height="16" rx="3"/>
<text class="s" x="938" y="903" text-anchor="start" >External / unmodified (Gemma 4, llama.cpp)</text>
<text x="30" y="930" font-size="12.5" fill="#0f172a">Measured with Gemma 4 E4B Q4_K_M (llama.cpp, Kaggle T4, n = 20). Only the solid teal boxes ran in the experiments.</text>
<text x="30" y="948" font-size="12.5" fill="#64748b">Source: src/logit_masker.py, src/llamacpp_backend.py, experiments/run_benchmark.py</text>
</svg>
