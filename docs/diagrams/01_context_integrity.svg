<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="930" viewBox="0 0 1460 930" font-family="Helvetica, Arial, sans-serif">
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
  <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker>
  <style>
    .t{font-size:15px;font-weight:700;fill:#0f172a}
    .s{font-size:12.5px;fill:#334155}
    .o{font-size:12px;fill:#b45309;font-weight:700}
    .lab{font-size:11.5px;fill:#475569}
    .tag{font-size:12px;font-weight:700;fill:#475569;letter-spacing:.06em}
    .impl{fill:#e6f4f1;stroke:#0f766e;stroke-width:2}
    .ext{fill:#f1f5f9;stroke:#64748b;stroke-width:2}
    .prop{fill:#f5f3ff;stroke:#6d28d9;stroke-width:2;stroke-dasharray:7 5}
    .amb{fill:#fff7ed;stroke:#b45309;stroke-width:2}
